services:
  trading-engine:
    build:
      context: ./trading
      dockerfile: Dockerfile
    image: nifty-scalper:latest
    container_name: nifty-scalper
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    env_file:
      - ./trading/.env
    volumes:
      # Persist SQLite trade database & audit logs across container restarts
      - ./trading/trades.db:/app/trades.db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

name: CI/CD Pipeline - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Automated Test Suite (Guarantees zero broken code)
  # -------------------------------------------------------------
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading/requirements.txt

      - name: Execute Pytest Suite (39 Tests)
        run: |
          python -m pytest trading/tests -v

  # -------------------------------------------------------------
  # STAGE 2: Build Lean Docker Image & Push to GHCR / Deploy
  # -------------------------------------------------------------
  deploy:
    name: Deploy Container to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        env:
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          # 1. Sanitize host (strip protocol, trailing ports, slashes, whitespace)
          TARGET_HOST=$(echo "$RAW_HOST" | sed -e 's|^[^/]*//||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          # If host is empty or a private AWS VPC IP (172.16-31.x.x, 10.x.x.x, 192.168.x.x), route to Public Elastic IP
          if [ -z "$TARGET_HOST" ] || [[ "$TARGET_HOST" =~ ^172\.(1[6-9]|2[0-9]|3[0-1])\. ]] || [[ "$TARGET_HOST" =~ ^10\. ]] || [[ "$TARGET_HOST" =~ ^192\.168\. ]]; then
            echo "⚠️ Target host '$TARGET_HOST' is an internal private VPC address. Overriding with Public Elastic IP: 23.23.172.189"
            TARGET_HOST="23.23.172.189"
          fi

          # 2. Resolve user (default to ubuntu)
          TARGET_USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          if [ -z "$TARGET_USER" ]; then
            TARGET_USER="ubuntu"
          fi

          echo "🚀 [CI/CD] Connecting to $TARGET_USER@$TARGET_HOST..."

          # 3. Setup SSH directory and private key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 4. Execute remote deployment over SSH
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/deploy_key "$TARGET_USER@$TARGET_HOST" << 'EOF'
            set -e
            echo "🚀 [CI/CD] Starting Deployment on AWS EC2..."
            APP_DIR="/home/ubuntu/trading_v2_upgrade"
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/ramji505/trade_signal_2.git "$APP_DIR"
            fi
            cd "$APP_DIR"

            # Pull latest git changes
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master

            # Ensure .env exists
            if [ ! -f "trading/.env" ]; then
              echo "⚠️ trading/.env not found, copying from .env.example"
              cp trading/.env.example trading/.env
            fi

            sed -i 's/SERVER_PORT=8000/SERVER_PORT=5000/g' trading/.env 2>/dev/null || true
            sed -i 's/ENFORCE_MARKET_HOURS=true/ENFORCE_MARKET_HOURS=false/g' trading/.env 2>/dev/null || true

            # Build and Launch Docker Containers
            docker compose down --remove-orphans || true
            docker compose up -d --build

            # Health Check Verification
            echo "🔍 [CI/CD] Verifying Health Check on port 5000..."
            for i in $(seq 1 15); do
              if curl -s -f http://localhost:5000/health > /dev/null; then
                echo "✅ Port 5000 responded successfully on attempt $i!"
                break
              fi
              echo "Attempt $i: waiting for server startup..."
              sleep 2
            done

            docker ps --filter "name=nifty-scalper"
            curl -f http://localhost:5000/health
            echo "✅ [CI/CD] Deployment Succeeded! Live on Port 5000."
          EOF

name: CI/CD Pipeline - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Automated Test Suite (Guarantees zero broken code)
  # -------------------------------------------------------------
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading/requirements.txt

      - name: Execute Pytest Suite (39 Tests)
        run: |
          python -m pytest trading/tests -v

  # -------------------------------------------------------------
  # STAGE 2: Build Lean Docker Image & Push to GHCR / Deploy
  # -------------------------------------------------------------
  deploy:
    name: Deploy Container to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Diagnostic Network Probe
        run: |
          {
            echo "=== RUNNER PUBLIC IP ==="
            curl -s https://api.ipify.org || true
            echo ""
            echo "=== HTTP PORT 5000 PROBE ==="
            curl -v -m 5 http://23.23.172.189:5000/health || echo "Port 5000 failed"
            echo "=== TCP PORT 22 PROBE ==="
            timeout 5 bash -c '</dev/tcp/23.23.172.189/22' && echo "Port 22 TCP OPEN" || echo "Port 22 TCP TIMED OUT"
          } > probe.log 2>&1
          cat probe.log

      - name: Upload Diagnostic Probe Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-log
          path: probe.log

      - name: Deploy to AWS EC2 via SSH
        env:
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          # 1. Target host: strictly route to verified Public Elastic IP
          TARGET_HOST="23.23.172.189"
          echo "Target host: $TARGET_HOST"

          # 2. Resolve user (default to ubuntu)
          TARGET_USER="ubuntu"
          if [ -n "$RAW_USER" ]; then
            CLEAN_USER=$(echo "$RAW_USER" | tr -d '[:space:]')
            [ -n "$CLEAN_USER" ] && TARGET_USER="$CLEAN_USER"
          fi

          echo "🚀 [CI/CD] Connecting to $TARGET_USER@$TARGET_HOST..."

          # 3. Setup SSH directory and private key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          KEY_LINES=$(wc -l < ~/.ssh/deploy_key)
          echo "Key file written: $KEY_LINES lines."
          if [ "$KEY_LINES" -lt 10 ]; then
            echo "❌ CRITICAL: SSH_KEY secret appears truncated or invalid! Expected ~27-30 lines, got $KEY_LINES."
            exit 1
          fi

          # 4. Execute remote deployment over SSH
          ssh -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa -o IPQoS=none -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key "$TARGET_USER@$TARGET_HOST" << 'EOF'
            set -e
            echo "🚀 [CI/CD] Starting Deployment on AWS EC2..."
            APP_DIR="/home/ubuntu/trading_v2_upgrade"
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/ramji505/trade_signal_2.git "$APP_DIR"
            fi
            cd "$APP_DIR"

            # Pull latest git changes
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master

            # Ensure .env exists
            if [ ! -f "trading/.env" ]; then
              echo "⚠️ trading/.env not found, copying from .env.example"
              cp trading/.env.example trading/.env
            fi

            sed -i 's/SERVER_PORT=8000/SERVER_PORT=5000/g' trading/.env 2>/dev/null || true
            sed -i 's/ENFORCE_MARKET_HOURS=true/ENFORCE_MARKET_HOURS=false/g' trading/.env 2>/dev/null || true

            # Build and Launch Docker Containers
            docker compose down --remove-orphans || true
            docker compose up -d --build

            # Health Check Verification
            echo "🔍 [CI/CD] Verifying Health Check on port 5000..."
            for i in $(seq 1 15); do
              if curl -s -f http://localhost:5000/health > /dev/null; then
                echo "✅ Port 5000 responded successfully on attempt $i!"
                break
              fi
              echo "Attempt $i: waiting for server startup..."
              sleep 2
            done

            docker ps --filter "name=nifty-scalper"
            curl -f http://localhost:5000/health
            echo "✅ [CI/CD] Deployment Succeeded! Live on Port 5000."
          EOF
